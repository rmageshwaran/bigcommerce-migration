services:
  # Azure Storage Emulator (Azurite) for local development
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: bigcommerce-azurite
    ports:
      - "10000:10000"  # Blob service
      - "10001:10001"  # Queue service  
      - "10002:10002"  # Table service
    volumes:
      - azurite-data:/data
    command: "azurite --silent --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log"
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1
# healthcheck:
      #   test: ["CMD-SHELL", "curl -f http://localhost:10001/ || exit 1"]
      #   interval: 10s
      #   timeout: 5s
      #   retries: 3
      #   start_period: 10s
    restart: unless-stopped
    networks:
      - bigcommerce-network

  # BigCommerce Migration Functions (Main API Service)
  bigcommerce-functions:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.functions.noanalyzers
    container_name: bigcommerce-functions
    ports:
      - "7071:80"
    environment:
      # Core Function Configuration
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
      - WEBSITE_RUN_FROM_PACKAGE=1
      - FUNCTIONS_EXTENSION_VERSION=~4
      - ASPNETCORE_ENVIRONMENT=Development
      - AZURE_FUNCTIONS_ENVIRONMENT=Development
      - DOTNET_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__BigCommerce.Migration=Debug
      - WEBSITE_HOSTNAME=localhost:7071
      
      # Queue Configuration (matches our fixed environment variables)
      - MigrationStartQueueName=migration-start
      - SignalRProgressQueueName=signalr-progress-events
      
      # ✅ UPDATED BigCommerce Configuration (Higher Performance)
      - BigCommerce__RateLimitRequestsPerSecond=25
      - BigCommerce__DefaultRateLimit=25
      - BigCommerce__ConcurrentRequests=20
      - BigCommerce__UserAgent=BigCommerce-Migration-System/1.0-Docker
      - BigCommerce__BaseUrl=https://api.bigcommerce.com
      - BigCommerce__RequestTimeout=00:00:30
      - BigCommerce__MaxRetries=3
      - BigCommerce__EnableDebugLogging=true
      
      # ✅ PREDICTIVE RATE LIMITING CONFIGURATION (Phase 4.1 - Docker Integration)
      # Feature Flags - Enable Predictive Distribution
      - DynamicRateLimiting__Features__EnableDynamicRateLimiting=true
      - DynamicRateLimiting__Features__EnableApiHealthMonitoring=true
      - DynamicRateLimiting__Features__EnableRealTimeEvents=true
      - DynamicRateLimiting__Features__EnableAdvancedRateCalculation=true
      - DynamicRateLimiting__Features__EnableBigCommerceRateLimitIntegration=true
      - DynamicRateLimiting__Features__EnableDetailedLogging=true
      - DynamicRateLimiting__Features__EnablePredictiveDistribution=true
      - DynamicRateLimiting__Features__EnableInstanceCoordination=true
      - DynamicRateLimiting__Features__EnableQuotaTracking=true
      
      # Rate Calculation Settings - Conservative for Docker
      - DynamicRateLimiting__RateCalculation__MinimumRate=5.0
      - DynamicRateLimiting__RateCalculation__MaximumRate=50.0
      - DynamicRateLimiting__RateCalculation__DefaultRate=12.0
      - DynamicRateLimiting__RateCalculation__ResponseTimeWeight=0.2
      - DynamicRateLimiting__RateCalculation__ErrorRateWeight=0.12
      - DynamicRateLimiting__RateCalculation__BigCommerceRateLimitWeight=0.12
      - DynamicRateLimiting__RateCalculation__HealthFactorWeight=0.56
      - DynamicRateLimiting__RateCalculation__CriticalHealthThreshold=25.0
      - DynamicRateLimiting__RateCalculation__ExcellentHealthThreshold=85.0
      - DynamicRateLimiting__RateCalculation__ExcellentHealthBoostMultiplier=1.3
      
      # Health Monitoring Settings
      - DynamicRateLimiting__HealthMonitoring__MonitoringWindowMinutes=5
      - DynamicRateLimiting__HealthMonitoring__MaxCallHistorySize=1000
      - DynamicRateLimiting__HealthMonitoring__SlowResponseThresholdMs=1000.0
      - DynamicRateLimiting__HealthMonitoring__CriticalResponseThresholdMs=3000.0
      - DynamicRateLimiting__HealthMonitoring__ErrorRateThreshold=0.05
      - DynamicRateLimiting__HealthMonitoring__CleanupIntervalSeconds=300
      - DynamicRateLimiting__HealthMonitoring__EnableAutomaticCleanup=true
      
      # Event Settings
      - DynamicRateLimiting__Events__SignificantRateChangeThreshold=0.2
      - DynamicRateLimiting__Events__SignificantHealthChangeThreshold=15.0
      - DynamicRateLimiting__Events__EventThrottleIntervalSeconds=30
      - DynamicRateLimiting__Events__EnableEventBatching=false
      - DynamicRateLimiting__Events__IncludeDetailedHealthInEvents=true
      
      # Safety Settings
      - DynamicRateLimiting__Safety__FallbackRateRequestsPerSecond=8.0
      - DynamicRateLimiting__Safety__MaxConsecutiveFailures=3
      - DynamicRateLimiting__Safety__FallbackRetryDelayMinutes=10
      - DynamicRateLimiting__Safety__EnableAutomaticRecovery=true
      - DynamicRateLimiting__Safety__EnableCircuitBreaker=true
      - DynamicRateLimiting__Safety__HealthMonitoringTimeoutMs=1000
      - DynamicRateLimiting__Safety__EnableGracefulDegradation=true
      
      # ✅ PREDICTIVE SETTINGS - OPTIMIZED FOR DOCKER DEPLOYMENT
      - DynamicRateLimiting__Predictive__SafetyBufferPercentage=0.25
      - DynamicRateLimiting__Predictive__HealthyQuotaThreshold=0.3
      - DynamicRateLimiting__Predictive__CriticalQuotaThreshold=0.1
      - DynamicRateLimiting__Predictive__TokenExpirySeconds=20
      - DynamicRateLimiting__Predictive__InstanceTimeoutSeconds=90
      - DynamicRateLimiting__Predictive__HeartbeatIntervalSeconds=45
      - DynamicRateLimiting__Predictive__MaxETagRetries=5
      - DynamicRateLimiting__Predictive__CoordinationHealthCheckSeconds=20
      - DynamicRateLimiting__Predictive__TableStorage__QuotaTableName=RateLimitQuotas
      - DynamicRateLimiting__Predictive__TableStorage__InstanceTableName=RateLimitInstances
      - DynamicRateLimiting__Predictive__TableStorage__TokenTableName=RateLimitTokens
      - DynamicRateLimiting__Predictive__TableStorage__AutoCreateTables=true
      
      # OpenSearch Configuration (External AWS)
      - OpenSearch__Endpoint=https://search-bigcommerceinsights-co3k7jb4ukk565b4c3bskzucpm.us-east-1.es.amazonaws.com
      - OpenSearch__Username=admin
      - OpenSearch__Password=VIQInsights@123
      - OpenSearch__DefaultIndex=migration-local-docker
      - OpenSearch__RequestTimeout=00:00:30
      - OpenSearch__MaxRetries=3
      - OpenSearch__EnableDebugMode=true
      
      # Blob Storage Configuration
      - ExternalBlobUrl=http://localhost:10000/devstoreaccount1
      
      # ✅ NEW PERFORMANCE CONFIGURATION (Replaces old AppSettings)
      # Global Parallel Processing Settings
      - ParallelProcessing__maxConcurrentBatches=4
      - ParallelProcessing__chunkingThreshold=100
      - ParallelProcessing__defaultChunkSize=50
      - ParallelProcessing__enableSubBatchOptimization=true
      - ParallelProcessing__signalRUpdateIntervalMs=250
      
      # Brand-Specific High Performance Settings (Target: ~30 second migrations)
      - ParallelProcessing__subBatchConfigurations__brands__entityType=brands
      - ParallelProcessing__subBatchConfigurations__brands__pageSize=250
      - ParallelProcessing__subBatchConfigurations__brands__chunkSize=250
      - ParallelProcessing__subBatchConfigurations__brands__fetchBatchSize=250
      - ParallelProcessing__subBatchConfigurations__brands__subBatchSize=30
      - ParallelProcessing__subBatchConfigurations__brands__maxConcurrency=25
      - ParallelProcessing__subBatchConfigurations__brands__enableSubBatching=true
      - ParallelProcessing__subBatchConfigurations__brands__subBatchDelayMs=50
      - ParallelProcessing__subBatchConfigurations__brands__processSubBatchesSequentially=false
      
      # ✅ Enhanced Product Configuration (Phase 1) - OPTIMIZED FOR TIMEOUT SAFETY
      - ParallelProcessing__subBatchConfigurations__products__entityType=products
      - ParallelProcessing__subBatchConfigurations__products__pageSize=250
      - ParallelProcessing__subBatchConfigurations__products__chunkSize=250
      - ParallelProcessing__subBatchConfigurations__products__fetchBatchSize=250
      - ParallelProcessing__subBatchConfigurations__products__subBatchSize=25
      - ParallelProcessing__subBatchConfigurations__products__maxConcurrency=10
      - ParallelProcessing__subBatchConfigurations__products__enableSubBatching=true
      - ParallelProcessing__subBatchConfigurations__products__subBatchDelayMs=50
      - ParallelProcessing__subBatchConfigurations__products__processSubBatchesSequentially=false
      - ParallelProcessing__subBatchConfigurations__products__include=bulk_pricing_rules,custom_fields,channels,videos
      
      # ✅ Phase 2: Product Components Configuration - 10/page with includes
      - ParallelProcessing__subBatchConfigurations__product-components__entityType=product-components
      - ParallelProcessing__subBatchConfigurations__product-components__pageSize=10
      - ParallelProcessing__subBatchConfigurations__product-components__chunkSize=10
      - ParallelProcessing__subBatchConfigurations__product-components__fetchBatchSize=10
      - ParallelProcessing__subBatchConfigurations__product-components__subBatchSize=5
      - ParallelProcessing__subBatchConfigurations__product-components__maxConcurrency=5
      - ParallelProcessing__subBatchConfigurations__product-components__enableSubBatching=true
      - ParallelProcessing__subBatchConfigurations__product-components__subBatchDelayMs=100
      - ParallelProcessing__subBatchConfigurations__product-components__processSubBatchesSequentially=false
      - ParallelProcessing__subBatchConfigurations__product-components__include=options,modifiers,reviews
      
      # Variants Configuration - Phase 3: Batch API with 50 variants per call
      - ParallelProcessing__subBatchConfigurations__variants__entityType=variants
      - ParallelProcessing__subBatchConfigurations__variants__fetchBatchSize=250
      - ParallelProcessing__subBatchConfigurations__variants__chunkSize=250
      - ParallelProcessing__subBatchConfigurations__variants__pageSize=250
      - ParallelProcessing__subBatchConfigurations__variants__subBatchSize=50
      - ParallelProcessing__subBatchConfigurations__variants__maxConcurrency=5
      - ParallelProcessing__subBatchConfigurations__variants__enableSubBatching=true
      - ParallelProcessing__subBatchConfigurations__variants__subBatchDelayMs=100
      - ParallelProcessing__subBatchConfigurations__variants__processSubBatchesSequentially=false
      - ParallelProcessing__subBatchConfigurations__variants__include=
      
      # ✅ Product-Related Configuration - Phase 3: Batch API with 10 products per call
      - ParallelProcessing__subBatchConfigurations__product-related__entityType=product-related
      - ParallelProcessing__subBatchConfigurations__product-related__fetchBatchSize=250
      - ParallelProcessing__subBatchConfigurations__product-related__chunkSize=250
      - ParallelProcessing__subBatchConfigurations__product-related__pageSize=250
      - ParallelProcessing__subBatchConfigurations__product-related__subBatchSize=10
      - ParallelProcessing__subBatchConfigurations__product-related__maxConcurrency=3
      - ParallelProcessing__subBatchConfigurations__product-related__enableSubBatching=true
      - ParallelProcessing__subBatchConfigurations__product-related__subBatchDelayMs=50
      - ParallelProcessing__subBatchConfigurations__product-related__processSubBatchesSequentially=false
      - ParallelProcessing__subBatchConfigurations__product-related__preferRangeAllocation=true
      - ParallelProcessing__subBatchConfigurations__product-related__include=
      
      # ✅ Product-Channel-Assign Configuration - Phase 8: RowNumber Pagination Support
      - ParallelProcessing__subBatchConfigurations__product-channel-assign__entityType=product-channel-assign
      - ParallelProcessing__subBatchConfigurations__product-channel-assign__pageSize=150
      - ParallelProcessing__subBatchConfigurations__product-channel-assign__chunkSize=150
      - ParallelProcessing__subBatchConfigurations__product-channel-assign__fetchBatchSize=150
      - ParallelProcessing__subBatchConfigurations__product-channel-assign__subBatchSize=12
      - ParallelProcessing__subBatchConfigurations__product-channel-assign__maxConcurrency=8
      - ParallelProcessing__subBatchConfigurations__product-channel-assign__enableSubBatching=true
      - ParallelProcessing__subBatchConfigurations__product-channel-assign__subBatchDelayMs=100
      - ParallelProcessing__subBatchConfigurations__product-channel-assign__processSubBatchesSequentially=false
      - ParallelProcessing__subBatchConfigurations__product-channel-assign__preferRangeAllocation=true
      
      # ✅ Product-Images Configuration - Phase 4: Individual product image updates
      - ParallelProcessing__subBatchConfigurations__product-images__entityType=product-images
      - ParallelProcessing__subBatchConfigurations__product-images__chunkSize=20
      - ParallelProcessing__subBatchConfigurations__product-images__fetchBatchSize=20
      - ParallelProcessing__subBatchConfigurations__product-images__pageSize=20
      - ParallelProcessing__subBatchConfigurations__product-images__subBatchSize=1
      - ParallelProcessing__subBatchConfigurations__product-images__maxConcurrency=5
      - ParallelProcessing__subBatchConfigurations__product-images__enableSubBatching=true
      - ParallelProcessing__subBatchConfigurations__product-images__subBatchDelayMs=0
      - ParallelProcessing__subBatchConfigurations__product-images__processSubBatchesSequentially=false
      - ParallelProcessing__subBatchConfigurations__product-images__imageChunkSize=50
      - ParallelProcessing__subBatchConfigurations__product-images__imageChunkDelayMs=300
      - ParallelProcessing__subBatchConfigurations__product-images__maxImagesPerProduct=1000
      - ParallelProcessing__subBatchConfigurations__product-images__cancellationCheckInterval=5
      - ParallelProcessing__subBatchConfigurations__product-images__preferRangeAllocation=true
      - ParallelProcessing__subBatchConfigurations__product-images__include=
      
      # Product-Metafields Configuration - Phase 7: Bulk API with 50 metafields per call
      - ParallelProcessing__subBatchConfigurations__product-metafields__entityType=product-metafields
      - ParallelProcessing__subBatchConfigurations__product-metafields__fetchBatchSize=250
      - ParallelProcessing__subBatchConfigurations__product-metafields__chunkSize=250
      - ParallelProcessing__subBatchConfigurations__product-metafields__pageSize=250
      - ParallelProcessing__subBatchConfigurations__product-metafields__subBatchSize=50
      - ParallelProcessing__subBatchConfigurations__product-metafields__maxConcurrency=5
      - ParallelProcessing__subBatchConfigurations__product-metafields__enableSubBatching=true
      - ParallelProcessing__subBatchConfigurations__product-metafields__subBatchDelayMs=100
      - ParallelProcessing__subBatchConfigurations__product-metafields__processSubBatchesSequentially=false
      - ParallelProcessing__subBatchConfigurations__product-metafields__include=
      
      # ✅ Enhanced Product Configuration (Phase 2 - comprehensive entity migration)

      
      # Default Configuration for Other Entities
      - ParallelProcessing__defaultSubBatchConfiguration__entityType=default
      - ParallelProcessing__defaultSubBatchConfiguration__pageSize=250
      - ParallelProcessing__defaultSubBatchConfiguration__chunkSize=250
      - ParallelProcessing__defaultSubBatchConfiguration__fetchBatchSize=250
      - ParallelProcessing__defaultSubBatchConfiguration__subBatchSize=25
      - ParallelProcessing__defaultSubBatchConfiguration__maxConcurrency=20
      - ParallelProcessing__defaultSubBatchConfiguration__enableSubBatching=true
      - ParallelProcessing__defaultSubBatchConfiguration__subBatchDelayMs=0
      - ParallelProcessing__defaultSubBatchConfiguration__processSubBatchesSequentially=false
      
      # SignalR Configuration (using Azure SignalR service)
      - AzureSignalRConnectionString=Endpoint=https://vortexiq-migration-signalr-dev.service.signalr.net;AccessKey=5LdRJbZb7Mq7Es4urlymsqw70FBjWHdqcJ7NALcGPRFrf67639RGJQQJ99BGACYeBjFXJ3w3AAAAASRSlVgW;Version=1.0;
      - ConnectionStrings__AzureSignalR=Endpoint=https://vortexiq-migration-signalr-dev.service.signalr.net;AccessKey=5LdRJbZb7Mq7Es4urlymsqw70FBjWHdqcJ7NALcGPRFrf67639RGJQQJ99BGACYeBjFXJ3w3AAAAASRSlVgW;Version=1.0;
      
      # SignalR Performance Optimization Configuration
      - SignalR__BaseUrl=http://localhost:7071
      - SignalR__TimeoutSeconds=30
      - SignalR__Enabled=true
      - SignalR__EnableDebugLogging=false
      - SignalR__MaxRetries=0
      - SignalR__EnableAsyncQueuing=true
      - SignalR__EnableBatching=false
      - SignalR__EnableHttpService=true
      - SignalR__Batching__BatchSize=15
      - SignalR__Batching__BatchTimeoutMs=300
      - SignalR__Batching__MaxQueueSize=2000
      - SignalR__Batching__Enabled=false
      
      # ✅ PHASE 8: RowNumber Service Configuration (Docker Development)
      - RowNumberService__MaxRetryAttempts=5
      - RowNumberService__BaseRetryDelayMs=75
      - RowNumberService__MaxRetryDelayMs=800
      - RowNumberService__MaxRangeAllocationSize=5000
      - RowNumberService__RangeAllocationThreshold=5
      - RowNumberService__EnableDetailedMetrics=true
      - RowNumberService__MetricsAggregationIntervalMs=30000
      - RowNumberService__EnablePerformanceRecommendations=true
      
      # ✅ PHASE 8: Azure Table Storage Configuration (Docker Development)
      - AzureTableStorage__MaxConnections=50
      - AzureTableStorage__RequestTimeoutMs=20000
      - AzureTableStorage__SdkMaxRetries=2
      - AzureTableStorage__SdkRetryDelayMs=300
      - AzureTableStorage__SdkMaxDelayMs=2000
      - AzureTableStorage__EnableConnectionPooling=true
      
      # Logging Configuration
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__BigCommerce.Migration=Debug
      - Logging__LogLevel__BigCommerce.Migration.Infrastructure.Services.RowNumberService=Debug
      - Logging__LogLevel__Microsoft=Warning
      
    depends_on:
      - azurite
    volumes:
      - ./src/BigCommerce.Migration.Functions:/app
      - functions-logs:/tmp/functions-logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 15s      # ✅ Reduced interval for faster monitoring
      timeout: 10s       # ✅ Extended timeout for concurrent operations
      retries: 3         # ✅ Reduced retries for faster recovery
      start_period: 30s  # ✅ Extended startup time for initialization
    restart: unless-stopped
    networks:
      - bigcommerce-network

  # Migration Dashboard (React App)
  bigcommerce-dashboard:
    platform: linux/amd64
    build:
      context: ./src/BigCommerce.Migration.Dashboard
      dockerfile: Dockerfile.dev
    container_name: bigcommerce-dashboard
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://bigcommerce-functions/api
      - VITE_SIGNALR_HUB_URL=http://localhost:7071/api
      - VITE_ENVIRONMENT=development
      - VITE_ENABLE_DEBUG_LOGGING=true
      - VITE_ENABLE_REALTIME=true
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
      - DOCKER_ENV=true
    volumes:
      - ./src/BigCommerce.Migration.Dashboard/src:/app/src
      - ./src/BigCommerce.Migration.Dashboard/public:/app/public
      - /app/node_modules
    depends_on:
      - bigcommerce-functions
    restart: unless-stopped
    networks:
      - bigcommerce-network



  # Test Services - Unit Tests
  unit-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
      target: unit-tests
    container_name: bigcommerce-unit-tests
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ConnectionStrings__AzureStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      # SignalR Test Configuration (Disabled for unit tests)
      - SignalR__BaseUrl=http://localhost:7071
      - SignalR__TimeoutSeconds=5
      - SignalR__Enabled=false
      - SignalR__EnableDebugLogging=false
      - SignalR__EnableAsyncQueuing=false
      - SignalR__EnableBatching=false
      - SignalR__EnableHttpService=false
    volumes:
      - test-results:/testresults
    depends_on:
      azurite:
        condition: service_healthy
    profiles:
      - testing
      - unit-tests
    networks:
      - bigcommerce-network

  # Test Services - Orchestration Tests
  orchestration-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
      target: orchestration-tests
    container_name: bigcommerce-orchestration-tests
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ConnectionStrings__AzureStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    volumes:
      - test-results:/testresults
    depends_on:
      azurite:
        condition: service_healthy
    profiles:
      - testing
      - orchestration-tests
    networks:
      - bigcommerce-network

  # Test Services - Integration Tests
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
      target: integration-tests
    container_name: bigcommerce-integration-tests
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ConnectionStrings__AzureStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - BigCommerce__BaseUrl=https://api.bigcommerce.com
      # SignalR Integration Test Configuration (Enabled with basic optimizations)
      - SignalR__BaseUrl=http://bigcommerce-functions:80
      - SignalR__TimeoutSeconds=10
      - SignalR__Enabled=true
      - SignalR__EnableDebugLogging=true
      - SignalR__EnableAsyncQueuing=true
      - SignalR__EnableBatching=false
      - SignalR__EnableHttpService=true
    volumes:
      - test-results:/testresults
    depends_on:
      azurite:
        condition: service_healthy
      bigcommerce-functions:
        condition: service_healthy
    profiles:
      - testing
      - integration-tests
    networks:
      - bigcommerce-network

  # Test Services - Performance Tests
  performance-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
      target: performance-tests
    container_name: bigcommerce-performance-tests
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ConnectionStrings__AzureStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - BigCommerce__BaseUrl=https://api.bigcommerce.com
    volumes:
      - test-results:/testresults
    depends_on:
      azurite:
        condition: service_healthy
      bigcommerce-functions:
        condition: service_healthy
    profiles:
      - testing
      - performance-tests
    networks:
      - bigcommerce-network

  # Test Services - All Tests (run all test suites)
  all-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
      target: all-tests
    container_name: bigcommerce-all-tests
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - ConnectionStrings__AzureStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - BigCommerce__BaseUrl=https://api.bigcommerce.com
    volumes:
      - test-results:/testresults
    depends_on:
      azurite:
        condition: service_healthy
      bigcommerce-functions:
        condition: service_healthy
    profiles:
      - testing
      - all-tests
    networks:
      - bigcommerce-network

volumes:
  azurite-data:
    driver: local
    name: bigcommerce-azurite-data
  functions-logs:
    driver: local
    name: bigcommerce-functions-logs
  test-results:
    driver: local
    name: bigcommerce-test-results

networks:
  bigcommerce-network:
    name: bigcommerce-migration-network
    driver: bridge 
